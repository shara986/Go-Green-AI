spring.application.name=GoGreen AI
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Configuration
server.port=8080
server.error.include-message=always

# Database Configuration
# Use MySQL by default when DB_URL is set explicitly; otherwise fall back to H2 for local development.
spring.datasource.url=${DB_URL:jdbc:h2:mem:gogreen_ai_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=413F4428472B4B6250655368566D5970337336763979244226452948404D6351
jwt.expiration=86400000

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Initial Admin Credentials (overridable via environment variables)
app.admin.username=${ADMIN_USERNAME:ashakumar}
app.admin.email=${ADMIN_EMAIL:admin@gogreen.ai}
app.admin.password=${ADMIN_PASSWORD:Password123!}
app.admin.name=${ADMIN_NAME:Asha Kumar}
app.admin.phone=${ADMIN_PHONE:+91 00000 00000}
